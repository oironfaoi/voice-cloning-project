model:
  name: "capleaf/viXTTS"
  cache_dir: "models/vixtts"

device: "cuda"

audio:
  sample_rate: 24000
  format: "wav"

paths:
  reference_voices: "./data/reference_voices"
  texts: "./data/texts"
  output_dir: "./outputs/cloned"
  log_dir: "./outputs/logs"

language: "vi"

normalization:
  # Bật/tắt toàn bộ bước chuẩn hóa văn bản trước khi đưa vào mô hình.
  enabled: true
  # Khi true: tự động phát hiện ngôn ngữ (vi/en) từ nội dung văn bản
  # thay vì luôn dùng giá trị 'language' ở trên.
  auto_detect_language: false
  # Khi true: bảo vệ code-block, inline-code, URL, email và ID
  # khỏi bị rewrite trong quá trình chuẩn hóa.
  preserve_spans: true